<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Rug background -->
  <rect width="32" height="32" fill="#8B6F47"/>
  
  <!-- Border pattern -->
  <rect x="2" y="2" width="28" height="28" fill="#D4C4B0" stroke="#6F5940" stroke-width="1"/>
  <rect x="4" y="4" width="24" height="24" fill="#E8E4D9"/>
  
  <!-- Center medallion -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#8B6F47" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#6F5940" stroke-width="1"/>
  
  <!-- Corner accents -->
  <circle cx="8" cy="8" r="1.5" fill="#8B6F47"/>
  <circle cx="24" cy="8" r="1.5" fill="#8B6F47"/>
  <circle cx="8" cy="24" r="1.5" fill="#8B6F47"/>
  <circle cx="24" cy="24" r="1.5" fill="#8B6F47"/>
  
  <!-- Letter K in center -->
  <text x="16" y="20" font-family="serif" font-size="12" font-weight="bold" fill="#6F5940" text-anchor="middle">K</text>
</svg>
