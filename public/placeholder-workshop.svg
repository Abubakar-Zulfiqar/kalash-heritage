<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F5F5F0"/>
  
  <!-- Floor -->
  <rect y="400" width="800" height="200" fill="#D4C4B0"/>
  
  <!-- Loom structure -->
  <rect x="150" y="150" width="20" height="300" fill="#8B6F47"/>
  <rect x="630" y="150" width="20" height="300" fill="#8B6F47"/>
  <rect x="150" y="130" width="500" height="20" fill="#8B6F47"/>
  
  <!-- Rug on loom -->
  <rect x="170" y="150" width="460" height="250" fill="#E8E4D9" stroke="#8B7355" stroke-width="3"/>
  <rect x="190" y="170" width="420" height="210" fill="#F0EBE0"/>
  
  <!-- Pattern on rug -->
  <line x1="220" y1="200" x2="580" y2="200" stroke="#C4A57B" stroke-width="2" opacity="0.5"/>
  <line x1="220" y1="250" x2="580" y2="250" stroke="#C4A57B" stroke-width="2" opacity="0.5"/>
  <line x1="220" y1="300" x2="580" y2="300" stroke="#C4A57B" stroke-width="2" opacity="0.5"/>
  <line x1="220" y1="350" x2="580" y2="350" stroke="#C4A57B" stroke-width="2" opacity="0.5"/>
  
  <circle cx="400" cy="280" r="40" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.4"/>
  
  <!-- Yarn baskets -->
  <ellipse cx="100" cy="480" rx="60" ry="30" fill="#A0826D"/>
  <ellipse cx="100" cy="460" rx="60" ry="20" fill="#B89968"/>
  
  <ellipse cx="700" cy="490" rx="50" ry="25" fill="#A0826D"/>
  <ellipse cx="700" cy="475" rx="50" ry="18" fill="#8B6F47"/>
  
  <!-- Text -->
  <text x="400" y="530" font-family="Georgia, serif" font-size="28" fill="#6F5940" text-anchor="middle" font-weight="bold">
    Kalash Heritage Workshop
  </text>
  <text x="400" y="560" font-family="Georgia, serif" font-size="16" fill="#8B7355" text-anchor="middle">
    Handcrafted with Tradition
  </text>
</svg>
