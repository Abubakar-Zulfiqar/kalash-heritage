# /etc/nginx/conf.d/kalash.conf  (source of truth: deploy/nginx/kalash.conf in the repo)
# Needs /etc/nginx/snippets/kalash-headers.conf (deploy/nginx/kalash-headers.conf)

upstream kalash_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Cache for optimized images from /_next/image (skips Node entirely on a hit)
proxy_cache_path /var/cache/nginx/kalash_images levels=1:2 keys_zone=kalash_images:20m
                 max_size=2g inactive=30d use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Image format the browser accepts; Next.js picks AVIF > WebP > original the
# same way, so caching per format lets every browser share one cache entry.
map $http_accept $kalash_img_format {
    default        orig;
    ~image/avif    avif;
    ~image/webp    webp;
}

# --- Shared TLS settings
ssl_certificate     /etc/letsencrypt/live/kalashheritage.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/kalashheritage.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- HTTP: everything goes to https://kalashheritage.com (except cert renewals)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://kalashheritage.com$request_uri;
    }
}

# --- www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name www.kalashheritage.com;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    return 301 https://kalashheritage.com$request_uri;
}

# --- Main site
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;
    http2 on;
    http3 on;
    server_name kalashheritage.com;

    client_max_body_size 12m;

    include /etc/nginx/snippets/kalash-headers.conf;

    # Next.js build assets: content-hashed, cache forever, never touch Node
    location /_next/static/ {
        alias /var/www/kalash/current/.next/static/;
        access_log off;
        include /etc/nginx/snippets/kalash-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded product images: unique filenames, served straight from disk
    location /uploads/ {
        alias /var/www/kalash/uploads/;
        access_log off;
        try_files $uri =404;
        include /etc/nginx/snippets/kalash-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimized images (AVIF/WebP, resized) cached by Nginx
    location /_next/image {
        proxy_pass http://kalash_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_cache kalash_images;
        proxy_cache_key "$host$request_uri$kalash_img_format";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        access_log off;
        include /etc/nginx/snippets/kalash-headers.conf;
        add_header X-Cache $upstream_cache_status;
    }

    # Files from /public (logos, placeholders, /data/*) straight from disk
    location ~* ^/(?!_next/|api/|uploads/).+\.(?:svg|png|jpe?g|webp|avif|gif|ico|pdf|txt|xml|webmanifest|woff2?)$ {
        root /var/www/kalash/current/public;
        access_log off;
        try_files $uri @next;
        include /etc/nginx/snippets/kalash-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://kalash_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
    }

    location @next {
        proxy_pass http://kalash_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
